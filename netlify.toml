# Netlify build settings for the Zend website (Astro).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed files never change: cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# The service worker must always be re-checked.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
