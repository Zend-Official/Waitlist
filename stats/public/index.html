<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Zend Stats</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="top__row">
      <a class="brand" href="#/overview"><svg aria-hidden="true" width="28" height="21" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 40 30"><path fill="currentColor" d="M30.32.63a3.08 3.08 0 0 1 2.4 5.07l-7.12 8.35h6.22a3 3 0 0 1 3 3v8.98a3 3 0 0 1-3 3h-8.98a3 3 0 0 1-3-3V20.8l-6.15 7.21a3 3 0 0 1-2.34 1.08H3.08A3.1 3.1 0 0 1 0 26.03v-3.05c0-.98.47-1.9 1.26-2.48l14.22-10.4-11.42 3.88A3.07 3.07 0 0 1 0 11.07V4.26a3.1 3.1 0 0 1 3.01-3.08zm7.04-1.1a2.55 2.55 0 1 1 0 5.09 2.55 2.55 0 0 1 0-5.1"/></svg><b>Zend</b><span>Stats</span></a>
      <span class="pill" id="network" hidden></span>
      <div class="top__tools">
        <button class="btn date-btn" type="button" popovertarget="range-pop"><span class="sr">Dates: </span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="range-label"></span></button>
        <button class="btn btn--icon btn--ghost" type="button" data-theme-toggle aria-label="Switch theme">☾</button>
        <button class="btn btn--icon btn--ghost" type="button" id="signout" aria-label="Sign out" title="Sign out"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3.5"/><path d="M16 16.5 20.5 12 16 7.5M20.5 12H9.5"/></svg></button>
      </div>
      <form class="range-pop" id="range-pop" popover>
        <p class="range-pop__title">Records created</p>
        <div class="range-pop__dates">
          <label class="field">From<input class="input" type="date" id="from" name="from" required></label>
          <label class="field">To<input class="input" type="date" id="to" name="to" required></label>
        </div>
        <div class="range-pop__presets">
          <button class="btn" type="button" data-days="7">7 days</button>
          <button class="btn" type="button" data-days="30">30 days</button>
          <button class="btn" type="button" data-days="90">90 days</button>
          <button class="btn" type="button" data-days="365">1 year</button>
        </div>
      </form>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/overview" data-tab="overview" title="Overview"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="tab__long">Overview</span><span class="tab__short">Overview</span></a>
      <a href="#/users" data-tab="users" title="Users"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg><span class="tab__long">Users</span><span class="tab__short">Users</span></a>
      <a href="#/payments" data-tab="payments" title="Payments"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6.5 15h4"/></svg><span class="tab__long">Payments</span><span class="tab__short">Payments</span></a>
      <a href="#/links" data-tab="links" title="Links"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg><span class="tab__long">Links</span><span class="tab__short">Links</span></a>
      <a href="#/operations" data-tab="operations" title="Operations"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg><span class="tab__long">Operations</span><span class="tab__short">Ops</span></a>
      <a href="#/issues" data-tab="issues" title="Issues"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5M12 17.2v.1"/></svg><span class="tab__long">Issues</span><span class="tab__short">Issues</span></a>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <div class="panel__head">
      <h2 id="panel-title"></h2>
      <button class="btn btn--icon btn--ghost" type="button" id="panel-close" aria-label="Close">✕</button>
    </div>
    <div class="panel__body" id="panel-body"></div>
  </dialog>
</body>
</html>
