<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Zend Stats</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login">
    <form id="login" novalidate>
      <div class="brand"><svg aria-hidden="true" width="28" height="21" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 40 30"><path fill="currentColor" d="M30.32.63a3.08 3.08 0 0 1 2.4 5.07l-7.12 8.35h6.22a3 3 0 0 1 3 3v8.98a3 3 0 0 1-3 3h-8.98a3 3 0 0 1-3-3V20.8l-6.15 7.21a3 3 0 0 1-2.34 1.08H3.08A3.1 3.1 0 0 1 0 26.03v-3.05c0-.98.47-1.9 1.26-2.48l14.22-10.4-11.42 3.88A3.07 3.07 0 0 1 0 11.07V4.26a3.1 3.1 0 0 1 3.01-3.08zm7.04-1.1a2.55 2.55 0 1 1 0 5.09 2.55 2.55 0 0 1 0-5.1"/></svg><b>Zend</b><span>Stats</span></div>
      <h1>Sign in</h1>
      <label class="field">Username
        <input class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32">
      </label>
      <label class="field">Password
        <input class="input" name="password" type="password" autocomplete="current-password" required maxlength="256">
      </label>
      <p class="alert" id="err" role="alert" hidden></p>
      <button class="btn btn--primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
